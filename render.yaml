services:
  - type: web
    name: paper2sim-api
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install .
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /health
