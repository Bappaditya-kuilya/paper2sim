[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper2sim"
version = "0.2.0"
description = "Extract equations from papers and visualize them interactively"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "pymupdf>=1.25.0",
]


authors = [
    {name = "Bappaditya Kuilya", email = "bappadityakuilya@gmail.com"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
]
license = "CC-BY-NC-SA-4.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28.0",
]

[project.scripts]
paper2sim = "paper2sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper2sim"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
