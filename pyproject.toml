[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper2sim"
version = "0.1.0"
description = "Convert academic papers into animated educational videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.3.1",
    "dotenv>=0.9.9",
    "langchain-openai>=1.1.6",
    "manim==0.19.1",
    "openai>=1.0.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.0.0",
    "streamlit>=1.0.0",
    "tqdm>=4.67.1",
]


authors = [
    {name = "Bappaditya Kuilya", email = "bappadityakuilya@gmail.com"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
]
license = "CC-BY-NC-SA-4.0"

[project.optional-dependencies]
dev = [
    "pandas>=2.3.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper2sim"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
