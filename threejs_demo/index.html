<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper2Sim — 3D Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; color: #eee; }
  canvas { display: block; }
  #overlay {
    position: fixed; top: 0; left: 0; height: 100%; width: 280px;
    background: rgba(10, 10, 30, 0.9); backdrop-filter: blur(12px);
    border-right: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; padding: 24px 20px; z-index: 10;
    overflow-y: auto;
  }
  #overlay h1 { font-size: 16px; font-weight: 600; color: #89b4fa; margin-bottom: 4px; }
  #overlay .subtitle { font-size: 11px; color: #888; margin-bottom: 16px; }
  #equation-display {
    font-size: 11px; color: #ccc; padding: 10px; margin-bottom: 16px;
    background: rgba(255,255,255,0.04); border-radius: 6px;
    font-family: 'Courier New', monospace; line-height: 1.6; word-break: break-all;
    max-height: 120px; overflow-y: auto;
  }
  .section-title { font-size: 11px; color: #89b4fa; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 8px; }
  select {
    width: 100%; padding: 8px; background: #1e1e2e; border: 1px solid #333;
    color: #eee; border-radius: 4px; font-size: 12px; margin-bottom: 12px;
  }
  .slider-group { margin-bottom: 14px; }
  .slider-group label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: #aaa; margin-bottom: 4px;
  }
  .slider-group label span.val {
    color: #89b4fa; font-weight: 600; font-family: 'Courier New', monospace;
    min-width: 36px; text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 3px;
    background: linear-gradient(90deg, #4a4a8a, #89b4fa);
    border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #fff; border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 6px rgba(137,180,250,0.6);
  }
  .hint { margin-top: auto; font-size: 10px; color: #555; text-align: center; line-height: 1.5; padding-top: 12px; }
  .no-eq { font-size: 11px; color: #666; font-style: italic; }
  .not-plot { font-size: 12px; color: #ff6b6b; padding: 20px; text-align: center; }
</style>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
</head>
<body>

<div id="overlay">
  <h1>Paper2Sim</h1>
  <div class="subtitle">3D Equation Sandbox</div>

  <div class="section-title">Paper Equations</div>
  <select id="eq-select">
    <option value="default">Select an equation...</option>
  </select>
  <div id="equation-display" class="no-eq">Select an equation to visualize</div>

  <div class="section-title">Parameters</div>
  <div id="sliders-container"></div>

  <div class="hint">Drag to rotate · Scroll to zoom · Sliders update in real-time</div>
</div>

<script>
(function() {
  var GRID = 80, SIZE = 6;
  var scene, camera, renderer, controls, surfaceMesh, wireframeMesh;
  var currentSurface = null;

  // Auto-generate surface from equation pattern (no hardcoding per equation)
  function autoMatchSurface(latex) {
    var l = latex.toLowerCase();

    // Pattern 1: softmax with Q/K/V → attention heatmap
    if (l.indexOf('softmax') >= 0 && (l.indexOf('q') >= 0 || l.indexOf('k') >= 0 || l.indexOf('v') >= 0)) {
      return { fn: function(x, y, p) { return Math.exp(p.a * x * y / Math.sqrt(p.d)); },
        params: { a: { min: 0.1, max: 3, step: 0.1, val: 1 }, d: { min: 1, max: 64, step: 1, val: 8 } },
        label: 'Attention Heatmap' };
    }
    // Pattern 2: softmax alone → softmax distribution
    if (l.indexOf('softmax') >= 0) {
      return { fn: function(x, y, p) { return Math.exp(p.a * x) / (Math.exp(p.a * x) + Math.exp(p.a * y)); },
        params: { a: { min: 0.1, max: 3, step: 0.1, val: 1 } },
        label: 'Softmax Distribution' };
    }
    // Pattern 3: layernorm/sublayer → layernorm surface
    if (l.indexOf('layernorm') >= 0 || l.indexOf('sublayer') >= 0) {
      return { fn: function(x, y, p) { return (x + y) / Math.sqrt(p.a * (x*x + y*y) + p.eps); },
        params: { a: { min: 0.1, max: 3, step: 0.1, val: 1 }, eps: { min: 0.001, max: 0.1, step: 0.001, val: 0.01 } },
        label: 'LayerNorm Surface' };
    }
    // Pattern 4: multihead/concat → attention heatmap
    if (l.indexOf('multihead') >= 0 || l.indexOf('concat') >= 0) {
      return { fn: function(x, y, p) { return Math.exp(p.a * x * y / Math.sqrt(p.d)); },
        params: { a: { min: 0.1, max: 3, step: 0.1, val: 1 }, d: { min: 1, max: 64, step: 1, val: 8 } },
        label: 'Multi-Head Attention' };
    }
    // Pattern 5: exp(-...) → gaussian
    if (l.indexOf('exp') >= 0 && l.indexOf('-') >= 0 && (l.indexOf('x^2') >= 0 || l.indexOf('x^{2}') >= 0 || l.indexOf('x*x') >= 0)) {
      return { fn: function(x, y, p) { return Math.exp(-(x*x + y*y) / (2 * p.sigma * p.sigma)); },
        params: { sigma: { min: 0.2, max: 3, step: 0.1, val: 1 } },
        label: 'Gaussian Surface' };
    }
    // Pattern 6: 1/(1+exp(...)) → sigmoid
    if (l.indexOf('1') >= 0 && l.indexOf('exp') >= 0 && (l.indexOf('1+') >= 0 || l.indexOf('1 +') >= 0)) {
      return { fn: function(x, y, p) { return 1 / (1 + Math.exp(-p.a * (x + y))); },
        params: { a: { min: 0.1, max: 5, step: 0.1, val: 1 } },
        label: 'Sigmoid Surface' };
    }
    // Pattern 7: sin/cos → wave surface
    if (l.indexOf('sin') >= 0 || l.indexOf('cos') >= 0) {
      return { fn: function(x, y, p) { return p.a * Math.sin(p.b * x) * Math.cos(p.c * y); },
        params: { a: { min: 0.1, max: 3, step: 0.05, val: 1 }, b: { min: 0.1, max: 5, step: 0.05, val: 1 }, c: { min: 0.1, max: 5, step: 0.05, val: 1 } },
        label: 'Wave Surface' };
    }
    // Pattern 8: dot product / \cdot → bilinear
    if (l.indexOf('cdot') >= 0 || l.indexOf('dot') >= 0 || l.indexOf('sum') >= 0) {
      return { fn: function(x, y, p) { return p.a * x * y; },
        params: { a: { min: 0.1, max: 3, step: 0.1, val: 1 } },
        label: 'Dot Product Surface' };
    }
    // Pattern 9: embedding/vocab → gaussian lookup
    if (l.indexOf('embedding') >= 0 || l.indexOf('vocab') >= 0 || l.indexOf('token') >= 0) {
      return { fn: function(x, y, p) { return Math.exp(-(x*x + y*y) / (2 * p.sigma * p.sigma)); },
        params: { sigma: { min: 0.2, max: 3, step: 0.1, val: 1 } },
        label: 'Embedding Space' };
    }
    // Pattern 10: loss/cost/minimize → loss landscape
    if (l.indexOf('loss') >= 0 || l.indexOf('cost') >= 0 || l.indexOf('minimize') >= 0 || l.indexOf('j(') >= 0 || l.indexOf('l(') >= 0) {
      return { fn: function(x, y, p) { return p.a * (x*x + p.b * y*y); },
        params: { a: { min: 0.1, max: 3, step: 0.1, val: 1 }, b: { min: 0.1, max: 3, step: 0.1, val: 1 } },
        label: 'Loss Landscape' };
    }
    // Pattern 11: gradient/nabla → gradient surface
    if (l.indexOf('gradient') >= 0 || l.indexOf('nabla') >= 0 || l.indexOf('partial') >= 0) {
      return { fn: function(x, y, p) { return p.a * x * Math.exp(-p.b * (x*x + y*y)); },
        params: { a: { min: 0.1, max: 3, step: 0.1, val: 1 }, b: { min: 0.1, max: 3, step: 0.1, val: 1 } },
        label: 'Gradient Surface' };
    }
    // Pattern 12: \frac{1}{\sqrt{...}} or scaling → 1/sqrt surface
    if (l.indexOf('frac') >= 0 && l.indexOf('sqrt') >= 0) {
      return { fn: function(x, y, p) { var d = Math.max(x*x + y*y, 0.01); return p.scale / Math.sqrt(d * p.k); },
        params: { scale: { min: 0.1, max: 5, step: 0.1, val: 1 }, k: { min: 0.1, max: 10, step: 0.1, val: 1 } },
        label: 'Scaling Surface' };
    }
    // Pattern 13: max(0, ...) → ReLU
    if (l.indexOf('max') >= 0 && l.indexOf('0') >= 0) {
      return { fn: function(x, y, p) { return Math.max(0, p.a * x + p.b * y); },
        params: { a: { min: -2, max: 2, step: 0.1, val: 1 }, b: { min: -2, max: 2, step: 0.1, val: 1 } },
        label: 'ReLU Surface' };
    }
    // Pattern 14: matrix/R^{...} → generic matrix surface
    if (l.indexOf('in') >= 0 && l.indexOf('r^{') >= 0) {
      return { fn: function(x, y, p) { return p.a * Math.sin(p.b * x) * Math.cos(p.c * y); },
        params: { a: { min: 0.1, max: 3, step: 0.05, val: 1 }, b: { min: 0.1, max: 5, step: 0.05, val: 1 }, c: { min: 0.1, max: 5, step: 0.05, val: 1 } },
        label: 'Matrix Space' };
    }

    // Default: try to render anything with = sign as a generic surface
    if (l.indexOf('=') >= 0) {
      return { fn: function(x, y, p) { return p.a * Math.sin(p.b * x) * Math.cos(p.c * y); },
        params: { a: { min: 0.1, max: 3, step: 0.05, val: 1 }, b: { min: 0.1, max: 5, step: 0.05, val: 1 }, c: { min: 0.1, max: 5, step: 0.05, val: 1 } },
        label: 'Generic Surface' };
    }

    // No = sign → not plottable as 3D surface
    return null;
  }

  var currentEq = 'default';
  var currentParams = {};
  var surfaces = {};

  function zFunc(x, y) {
    if (!currentSurface) return 0;
    return currentSurface.fn(x, y, currentParams);
  }

  function zColor(t) {
    var r = t < 0.5 ? 0 : (t - 0.5) * 2;
    var g = t < 0.5 ? t * 2 : 2 - t * 2;
    var b = t > 0.5 ? 0 : 1 - t * 2;
    return new THREE.Color(r * 0.4 + 0.1, g * 0.3 + 0.05, b * 0.8 + 0.2);
  }

  function buildSurface() {
    if (surfaceMesh) { scene.remove(surfaceMesh); surfaceMesh.geometry.dispose(); surfaceMesh.material.dispose(); }
    if (wireframeMesh) { scene.remove(wireframeMesh); wireframeMesh.geometry.dispose(); wireframeMesh.material.dispose(); }

    if (!currentSurface) return;

    var geo = new THREE.BufferGeometry();
    var verts = [], colors = [], indices = [];
    var half = SIZE / 2, step = SIZE / GRID;
    var zVals = [];
    for (var i = 0; i <= GRID; i++)
      for (var j = 0; j <= GRID; j++)
        zVals.push(zFunc(-half + i * step, -half + j * step));

    var zMin = Infinity, zMax = -Infinity;
    for (var k = 0; k < zVals.length; k++) {
      if (zVals[k] < zMin) zMin = zVals[k];
      if (zVals[k] > zMax) zMax = zVals[k];
    }
    var zRange = zMax - zMin || 1;
    var idx = 0;
    for (var i = 0; i <= GRID; i++) {
      for (var j = 0; j <= GRID; j++) {
        var x = -half + i * step, y = -half + j * step, z = zVals[idx];
        verts.push(x, z, -y);
        var t = (z - zMin) / zRange;
        var c = zColor(t);
        colors.push(c.r, c.g, c.b);
        idx++;
      }
    }
    for (var i = 0; i < GRID; i++)
      for (var j = 0; j < GRID; j++) {
        var a = i * (GRID + 1) + j, b = a + 1, cc = a + (GRID + 1), d = cc + 1;
        indices.push(a, cc, b, b, cc, d);
      }

    geo.setIndex(indices);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.computeVertexNormals();

    surfaceMesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      vertexColors: true, shininess: 80, side: THREE.DoubleSide,
    }));
    scene.add(surfaceMesh);

    wireframeMesh = new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({
      color: 0xffffff, wireframe: true, transparent: true, opacity: 0.07,
    }));
    scene.add(wireframeMesh);
  }

  function buildSliders() {
    var container = document.getElementById('sliders-container');
    container.innerHTML = '';
    currentParams = {};

    if (!currentSurface) {
      container.innerHTML = '<div class="not-plot">This equation cannot be visualized as a 3D surface. It is a constant or parameter definition.</div>';
      return;
    }

    var paramNames = Object.keys(currentSurface.params);
    for (var pi = 0; pi < paramNames.length; pi++) {
      var name = paramNames[pi];
      var cfg = currentSurface.params[name];
      currentParams[name] = cfg.val;
      var div = document.createElement('div');
      div.className = 'slider-group';
      div.innerHTML = '<label>' + name + ' <span class="val" id="val-' + name + '">' + cfg.val + '</span></label>' +
        '<input type="range" id="sl-' + name + '" min="' + cfg.min + '" max="' + cfg.max + '" step="' + cfg.step + '" value="' + cfg.val + '">';
      container.appendChild(div);
      (function(n, sl) {
        sl.addEventListener('input', function() {
          currentParams[n] = parseFloat(sl.value);
          document.getElementById('val-' + n).textContent = currentParams[n].toFixed(2);
          buildSurface();
        });
      })(name, div.querySelector('input'));
    }
  }

  function populateDropdown() {
    var select = document.getElementById('eq-select');
    while (select.options.length > 1) select.remove(1);

    var paperEqs = [];
    try {
      var params = new URLSearchParams(window.location.search);
      var eqParam = params.get('equations_b64');
      if (eqParam) {
        paperEqs = JSON.parse(atob(eqParam));
      } else {
        var eqParam2 = params.get('equations');
        if (eqParam2) paperEqs = JSON.parse(eqParam2);
        else if (window.__PAPER_EQUATIONS__ && Array.isArray(window.__PAPER_EQUATIONS__)) {
          paperEqs = window.__PAPER_EQUATIONS__;
        }
      }
    } catch(e) { console.error('Failed to parse equations:', e); }

    if (paperEqs.length > 0) {
      for (var i = 0; i < paperEqs.length; i++) {
        var eq = paperEqs[i];
        var surface = autoMatchSurface(eq.latex);
        surfaces['eq_' + i] = surface;
        var opt = document.createElement('option');
        opt.value = 'eq_' + i;
        var label = surface ? surface.label : 'Not Plottable';
        var display = eq.latex.length > 50 ? eq.latex.substring(0, 50) + '...' : eq.latex;
        opt.textContent = '[' + label + '] ' + display;
        select.appendChild(opt);
      }
    }
  }

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.5, 4.5, 5.5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2;
    controls.maxDistance = 20;

    scene.add(new THREE.AmbientLight(0x404060, 0.6));
    var dl = new THREE.DirectionalLight(0xffffff, 1.2);
    dl.position.set(5, 8, 5);
    scene.add(dl);

    var grid = new THREE.GridHelper(SIZE, 12, 0x333355, 0x222244);
    grid.position.y = -0.01;
    scene.add(grid);

    var plane = new THREE.Mesh(
      new THREE.PlaneGeometry(SIZE, SIZE),
      new THREE.MeshBasicMaterial({ color: 0x111128, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
    );
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -0.02;
    scene.add(plane);

    var len = SIZE / 2 + 0.3;
    function addAxis(from, to, color) {
      var g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(from[0],from[1],from[2]), new THREE.Vector3(to[0],to[1],to[2])]);
      scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: color })));
    }
    addAxis([-len,0,0], [len,0,0], 0xff6666);
    addAxis([0,-len,0], [0,len,0], 0x66ff66);
    addAxis([0,0,-len], [0,0,len], 0x6666ff);

    populateDropdown();
    buildSliders();
    buildSurface();

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
  }

  var select = document.getElementById('eq-select');
  var eqDisplay = document.getElementById('equation-display');

  select.addEventListener('change', function() {
    currentEq = select.value;
    if (currentEq === 'default') {
      currentSurface = null;
      eqDisplay.textContent = 'Select an equation to visualize';
      eqDisplay.classList.add('no-eq');
    } else {
      currentSurface = surfaces[currentEq];
      var paperEqs = [];
      try {
        var params = new URLSearchParams(window.location.search);
        var eqParam = params.get('equations');
        if (eqParam) paperEqs = JSON.parse(decodeURIComponent(eqParam));
        else if (window.__PAPER_EQUATIONS__) paperEqs = window.__PAPER_EQUATIONS__;
      } catch(e) {}
      var idx = parseInt(currentEq.replace('eq_', ''));
      eqDisplay.textContent = paperEqs[idx] ? paperEqs[idx].latex : '';
      eqDisplay.classList.remove('no-eq');
    }
    buildSliders();
    buildSurface();
  });

  var checkCount = 0;
  var checkInterval = setInterval(function() {
    var params = new URLSearchParams(window.location.search);
    var eqParam = params.get('equations_b64');
    if (eqParam) {
      try {
        var eqs = JSON.parse(atob(eqParam));
        if (eqs.length > 0) { populateDropdown(); clearInterval(checkInterval); }
      } catch(e) {}
    } else {
      var eqParam2 = params.get('equations');
      if (eqParam2) {
        try {
          var eqs2 = JSON.parse(eqParam2);
          if (eqs2.length > 0) { populateDropdown(); clearInterval(checkInterval); }
        } catch(e) {}
      }
    }
    if (window.__PAPER_EQUATIONS__ && Array.isArray(window.__PAPER_EQUATIONS__) && window.__PAPER_EQUATIONS__.length > 0) {
      populateDropdown();
      clearInterval(checkInterval);
    }
    checkCount++;
    if (checkCount > 50) clearInterval(checkInterval);
  }, 100);

  init();
})();
</script>
</body>
</html>
